# privileged_diagnostic: grasp QP ON + priv monitor (tilt/lost/pop).
# PCI — socket bias PBVS + Phase B force/tactile compliant

approach:
  mode: pbvs_coarse_align
  pbvs_standoff_m: 0.055
  standoff_tol_m: 0.020
  lat_gate_m: 0.025
  angle_tol_rad: 0.22
  max_align_steps: 1000
  handoff_settle_frames: 30
  left_share_xy: 0.35
  left_share_rot: 0.22
  freeze_left_arm_at_handoff: false
  # 贴面：左不跟拧；搜索阶段左腕可用 FT 导纳（钉在 settle hold 上加微量）
  surface_left_share_xy: 0.0
  surface_left_share_rot: 0.0
  surface_freeze_left: true
  pbvs_lambda_xy: 0.45
  pbvs_lambda_z: 0.22
  pbvs_lambda_rot: 0.10
  max_left_wrist_step_m: 0.0025
  pos_tol_m: 0.006
  axis_align_max_lat_m: 0.014
  insert_align_confirm_frames: 99999
  peg_lost_abort_frames: 9999
  surface_min_lat_m: 0.008
  surface_hold_frames: 2
  surface_fail_hold_frames: 15
  surface_tray_lost_frames: 20
  surface_force_baseline_frames: 40
  # 轻贴面：减接触法向，降低后续螺旋顶翻力矩
  surface_force_soft_delta_n: 0.35
  surface_force_delta_n: 0.50
  surface_force_confirm_frames: 1
  surface_force_arm_after_steps: 80
  surface_left_grasp_scale: 1.40
  surface_left_grasp_scale_init: 1.10
  surface_right_grasp_scale: 1.10
  phase_b_left_grasp_scale: 1.28
  surface_unload_retract_m: 0.0
  surface_settle_seconds: 0.3
  surface_settle_max_tray_tilt_deg: 20.0
  surface_settle_hard_tilt_deg: 32.0
  surface_settle_unload_m: 0.0
  surface_resid_unload_max_steps: 0
  surface_contact_unload_m: 0.0
  # 残差微卸：默认关（一次 6mm 已够）；需要再开
  surface_resid_ok_n: 0.50
  surface_resid_unload_step_m: 0.00035
  surface_resid_unload_max_steps: 0
  surface_resid_unload_cap_m: 0.010
  socket_bias:
    lat_std_m: 0.012
    min_lat_m: 0.008
    max_lat_m: 0.014
    axis_tilt_std_rad: 0.0
    axis_tilt_min_rad: 0.0
    axis_tilt_max_rad: 0.0
    max_resamples: 8
    seed: 0

sim:
  max_seconds: 90.0
  max_control_steps: 2800
  max_pos_step_m: 0.0030
  max_rot_step_rad: 0.02
  fps: 30
  dexjoco_root: /home/wangrenpeng/dexjoco

compliant:
  search:
    push_force_n: 0.35
    unload_max_m: 0.0
    unload_k_z: 0.0015
    left_spiral_share: 0.0
    left_axial_share: 0.0
    left_unload_share: 0.0
    right_lat_scale: 1.0
    hold_press_m: 0.0
    contact_f_des_n: 0.35
    contact_press_gain: 0.0
    admittance_k_z: 0.00025
    admittance_k_xy: 0.00004
    admittance_b: 0.00012
    wrench_lpf_alpha: 0.35
    # 螺旋要能盖住 bias+接触偏（~30mm）；空转贴面会粘死 tip
    spiral_track_gain: 1.0
    spiral_pitch_m: 0.0015
    spiral_step_rad: 0.14
    spiral_radius_max_m: 0.038
    max_lat_step_m: 0.0015
    max_admit_step_m: 0.0015
    f_axial_max_n: 10.0
    retreat_step_m: 0.0008
    max_search_steps: 2400
    min_search_steps: 30
    contact_min_n: 0.35
    contact_seek_max_steps: 150
    hole_detect_fz_drop_n: 0.70
    hole_f_max_n: 10.0
    hole_detect_confirm: 3
    spiral_try_min_radius_m: 0.022
    spiral_try_insert_theta: 999.0
    # 特权诊断：真进孔=近轴+along坐下；禁止 lat-only try_insert
    priv_assist: true
    priv_enter_lat_m: 0.0045
    priv_far_lat_m: 0.010
    priv_seek_step_m: 0.00075
    priv_enter_along_max_m: 0.100
    priv_enter_require_along: true
    priv_enter_require_force: false
    # spiral 轻贴，防开搜瞬间顶翻
    near_hole_press_m: 0.00035
    spiral_surface_press_scale: 0.35
    near_axial_keep_lat_m: 0.0018
    near_hole_left_share: 0.28
    insert_left_share: 0.22
    insert_pure_axial_lat_m: 0.0018
    jam_spiral_boost_steps: 12
    jam_spiral_track_gain: 1.0
    discrete_hop: false
    hop_lift_m: 0.0035
    hop_press_m: 0.0012
    hop_period_steps: 9
    hop_lift_step_m: 0.0015
    hop_press_step_m: 0.00035
    hop_clear_m: 0.0015
    hop_lift_cmd_budget_m: 0.035
    abort_on_tray_lost: true
    search_max_tray_tilt_deg: 18.0
    search_hard_tray_tilt_deg: 32.0
    search_hold_xy_steps: 12
    search_guard_steps: 12
    search_freeze_tilt_deg: 4.0
    search_tip_soft_deg: 16.0
    mouth_hold_stop: true
    mouth_hold_confirm_frames: 5
    mouth_max_tilt_deg: 18.0
    mouth_max_lat_m: 0.0045
    mouth_max_along_m: 0.105
    peg_ok_grace_frames: 8
    insert_tilt_warn_deg: 12.0
    insert_mouth_along_min_m: 0.085
    insert_mouth_unload_m: 0.00020
    insert_mouth_left_admit_scale: 0.50
    search_left_admit_scale: 0.0
    insert_chamfer_lo_m: 0.075
    insert_chamfer_hi_m: 0.095
    insert_chamfer_stall_hold: 8
    insert_max_tray_tilt_deg: 24.0
    search_unload_if_abs_fz_n: 99.0
    search_abs_fz_target_n: 99.0
    search_unload_step_m: 0.0003
    search_unload_cap_m: 0.0
    tip_stuck_window: 45
    tip_stuck_cmd_m: 0.012
    tip_stuck_move_m: 0.0004
    # 粘着：连续 N 步 tip≪cmd → re-sync mocap→site
    tip_resync_window: 24
    tip_resync_move_m: 0.00015
    mocap_site_drift_cap_m: 0.010
    near_bottom_axial_drift_cap_m: 0.003
  insert:
    admittance_k_axial: 0.00030
    admittance_k_lateral: 0.00070
    admittance_b: 0.00012
    wrench_lpf_alpha: 0.35
    max_admit_step_m: 0.0020
    f_axial_limit_n: 12.0
    f_lateral_limit_n: 8.0
    f_insert_des_n: 0.80
    hold_press_m: 0.00035
    early_release_along_m: 0.018
    early_release_wait_frames: 12
    near_bottom_grasp_scale: 1.0
    left_insert_share: 0.0
    stall_patience: 12
    retreat_step_m: 0.0008
    max_insert_steps: 2500
    wiggle_radius_m: 0.0
    peck_enable: false
  pipeline:
    max_jam_recoveries: 12
  release:
    open_rate: 0.20
    max_release_steps: 200
    open_scale: 0.0
    unload_step_m: 0.0
    peel_step_m: 0.00045
    pre_seat_retract_m: 0.0
    open_after_peel_m: 0.002
    left_grasp_scale: 1.35
    open_delay_steps: 20
    creep_after_steps: 8
    creep_step_m: 0.00055
    open_before_unload: 1.0
  fingers:
    k_admit: 0.00028
    max_joint_step: 0.014
    balance_gain: 0.08
    f_balance_des_n: 1.6
    b_admit: 0.45
    hold_open_limit: 0.05
    hold_close_limit: 0.03
    enable: false
  left_wrist_admit:
    enable: true
    k_force: 0.00010
    k_torque: 0.00070
    max_step_m: 0.00035
    max_total_m: 0.006
    wrench_lpf_alpha: 0.40
    f_deadband_n: 0.40
    tau_deadband_nm: 0.05
  # INSERT/RELEASE：只跟 tray 平移（不跟倾覆旋转，避免正反馈）
  left_tray_follow:
    enable: true
    max_step_m: 0.0008
    max_rot_step_rad: 0.010
    track_gain: 0.70
    follow_rot: false
  priv_grasp_opt:
    enable: true
    k_pos: 18.0
    k_rot: 0.4
    k_rel_rot: 0.25
    regulate_rel_translation: false
    friction_mu: 0.45
    n_cone_vecs: 4
    torque_weight: 5.0
    f_squeeze_n: 2.8
    f_min_n: 0.5
    f_max_n: 5.0
    lambda_reg: 0.45
    k_admit: 0.00028
    b_admit: 0.45
    max_joint_step: 0.012
    hold_open_limit: 0.05
    hold_close_limit: 0.04
    w_force_max_n: 3.0
    w_torque_max_nm: 0.15
